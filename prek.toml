# Baseline checks that hold for the tree as it is: they only report, they never rewrite.
[[repos]]
repo = "builtin"
hooks = [
  { id = "check-merge-conflict", args = ["--assume-in-merge"] },
  { id = "check-case-conflict" },
  { id = "check-added-large-files", args = ["--maxkb=51200"] },
  { id = "detect-private-key" },
  { id = "check-yaml" },
  { id = "check-toml" },
  { id = "check-json" },
  { id = "check-xml" },
]
